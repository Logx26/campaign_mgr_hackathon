# Infrastructure stack — Postgres + Redis + Qdrant.
# Use this only if the organizer-provided storage containers are not already running.
#
# Bring up:    docker compose -f docker-compose.infra.yml up -d
# Tear down:   docker compose -f docker-compose.infra.yml down
# With wipe:   docker compose -f docker-compose.infra.yml down -v

services:
  postgres:
    image: postgres:16
    container_name: hackathon-postgres
    environment:
      POSTGRES_USER: hackuser
      POSTGRES_PASSWORD: hackpass
      POSTGRES_DB: hackdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackuser -d hackdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hackathon-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hackathon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
