[theme]
# Lumeo Campaign Studio — P11 palette refresh (see ADR-009 candidate, ui/styles.py).
# Layered surfaces (canvas / panel / elevated) + calm electric blue accent.
primaryColor = "#4F8CFF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
textColor = "#ECF1F7"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
