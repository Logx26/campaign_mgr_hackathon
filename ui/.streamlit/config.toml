[theme]
# Lumeo Campaign Studio — light production theme (P11 Iteration 2).
# Indigo accent on near-white canvas; high-contrast slate text.
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
