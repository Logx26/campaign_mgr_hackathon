source_name: "Q3 nurture email — trial day 14"
channel: Email
audience_hint: "Trial users at 1000+ employee companies"
body: |
  You're two weeks into your Axion trial. You've connected your CRM and billing
  data — that's the hard part done.

  The next step is the one most teams skip: turning those weekly reconciliation
  hours into ten minutes. Our AI-powered reporting flags the three accounts in
  your trial pipeline most likely to convert this month and explains why.

  Book a demo with one of our revenue operations specialists and we'll walk
  through your data live.
