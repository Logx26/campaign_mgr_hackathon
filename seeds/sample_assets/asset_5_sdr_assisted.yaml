body: |
  Saw your post on the cost of Monday morning reconciliation cycles — that lined up
  with what we hear from most revenue ops leaders we work with.

  Axion is an AI-assisted reporting layer that pulls CRM, billing, and finance data
  into one decision-ready view. Two of your peers in financial services replaced
  most of that manual reconciliation in their first quarter with us.

  If that's worth 15 minutes next week, book a demo and we'll walk through it on
  your data.
